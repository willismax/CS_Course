<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OSI 與 TCP/IP 3D 實驗室</title>
<meta name="description" content="用 3D 疊層對照 OSI 七層與 TCP/IP 四層，看一個 HTTP 請求如何層層封裝、經過交換器與路由器、在伺服器端解封裝，附 Python、C、Java 封裝程式與練習題。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: mode rail across the top → [3D stage + mode panel + transport | code + theory], one column under 1060px. Same visual system as the sorting, tree and subnet labs. */
:root{
  --bg:#E7EBF2; --surface:#F8FAFD; --surface-2:#EEF2F8; --ink:#141B2D; --muted:#59647A; --line:#D1D8E4;
  --accent:#2C54D6; --accent-ink:#FFFFFF;
  --ok:#1FA85B; --bad:#E2412F; --cmp:#E7A400;
  --l7:#E2487E; --l6:#EE7A35; --l5:#D9A11A; --l4:#33A65B; --l3:#2D7FD8; --l2:#5C52D6; --l1:#8E58C8;
  --stage-a:#D9E0EC; --stage-b:#F4F7FB; --floor:#CBD3E1; --cable:#3A4256;
  --code-bg:#F3F6FA; --code-hot:#FFF0B8; --code-hot-bar:#E7A400;
  --tok-kw:#A8237A; --tok-fn:#2145B5; --tok-num:#B04F08; --tok-str:#2D7A31; --tok-com:#7A8497;
  --font-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D121C; --surface:#141B28; --surface-2:#1A2232; --ink:#E4E9F3; --muted:#8D98AD; --line:#263043;
    --accent:#7F9BFF; --accent-ink:#0D121C;
    --ok:#3CD58A; --bad:#FF6A55; --cmp:#FFC23A;
    --stage-a:#090D15; --stage-b:#18202F; --floor:#1C2434; --cable:#8B95AB;
    --code-bg:#10161F; --code-hot:#3A3115; --code-hot-bar:#FFC23A;
    --tok-kw:#F28BC6; --tok-fn:#8FB0FF; --tok-num:#F3A75F; --tok-str:#8DD592; --tok-com:#68748A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D121C; --surface:#141B28; --surface-2:#1A2232; --ink:#E4E9F3; --muted:#8D98AD; --line:#263043;
  --accent:#7F9BFF; --accent-ink:#0D121C;
  --ok:#3CD58A; --bad:#FF6A55; --cmp:#FFC23A;
  --stage-a:#090D15; --stage-b:#18202F; --floor:#1C2434; --cable:#8B95AB;
  --code-bg:#10161F; --code-hot:#3A3115; --code-hot-bar:#FFC23A;
  --tok-kw:#F28BC6; --tok-fn:#8FB0FF; --tok-num:#F3A75F; --tok-str:#8DD592; --tok-com:#68748A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 32px;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.top > *{min-width:0}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 28px}
.brand{display:grid;gap:2px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(24px,2.8vw,34px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--accent);font-weight:800}
.modes{display:flex;gap:0;overflow-x:auto;max-width:100%;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.mode-tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:6px 14px 8px;cursor:pointer;display:grid;gap:0;text-align:left;color:var(--muted);transition:color .15s,border-color .15s}
.mode-tab .zh{font-weight:700;font-size:15px;line-height:1.3;white-space:nowrap}
.mode-tab .en{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.02em;opacity:.85;white-space:nowrap}
.mode-tab:hover{color:var(--ink)}
.mode-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mode-tab[aria-selected="true"] .en{color:var(--accent);opacity:1}

/* ---------- main grid ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1060px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:12px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}

/* ---------- stage ---------- */
.stage{position:relative;height:clamp(360px,58vh,700px);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 18%,var(--stage-b) 0%,var(--stage-a) 70%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage canvas.on-layer{cursor:pointer}
.hud{position:absolute;pointer-events:none;display:flex;gap:8px}
.hud > *{pointer-events:auto}
.chip{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--line) 85%,transparent);border-radius:10px;padding:8px 12px}
.hud-tl{top:12px;left:12px;flex-direction:column;align-items:flex-start}
.hud-title{display:grid;gap:0}
.hud-title .zh{font-weight:900;font-size:19px;line-height:1.25}
.hud-title .en{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.hud-tr{top:12px;right:12px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.stat{display:grid;gap:0;text-align:right;min-width:64px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud-bl{left:12px;bottom:12px;flex-wrap:wrap;align-items:center}
.hud-br{right:12px;bottom:12px}
.seg{display:inline-flex;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:560px){.hud-tl{display:none}.hud-tr{max-width:100%}}
.tip{position:absolute;pointer-events:none;font-size:12.5px;padding:5px 9px;border-radius:7px;background:var(--ink);color:var(--surface);white-space:nowrap;transform:translate(-50%,calc(-100% - 14px));z-index:3}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

/* ---------- mode panels ---------- */
.mpanel{padding:14px 16px;display:grid;gap:12px}
.narr-row{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.narr-step{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.narr-text{font-size:16px;font-weight:500;min-width:0;flex:1 1 280px}
.detail{display:grid;gap:10px}
.detail-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:8px;color:#fff;font-family:var(--font-display);font-weight:800;font-size:18px}
.detail-head h2{margin:0;font-size:20px;line-height:1.3}
.detail-head .en{color:var(--muted);font-family:var(--font-mono);font-size:12.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;margin:0}
.facts div{display:grid;gap:1px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.note{margin:0;font-size:13.5px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;max-width:70ch}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.cmp th{background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
.cmp td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp tr:last-child td{border-bottom:0}
.cmp td.lay{white-space:nowrap;font-weight:600}
.cmp td.lay i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.cmp td.grp{background:var(--surface-2);font-weight:600;white-space:nowrap;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.cmp tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cmp tr{cursor:pointer}
.anat{display:grid;gap:4px}
.arow{display:grid;grid-template-columns:118px minmax(0,1fr) 64px;gap:10px;align-items:baseline;padding:6px 10px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--c);font-size:13.5px;transition:opacity .25s}
.arow .nm{font-weight:700}
.arow .fd{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere}
.arow .sz{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:right}
.arow.new{animation:pop .45s ease-out}
.arow.changed .fd{color:var(--bad);font-weight:600}
@keyframes pop{0%{transform:scale(.96);opacity:.3}100%{transform:none;opacity:1}}
@media (max-width:520px){.arow{grid-template-columns:minmax(0,1fr) 54px}.arow .fd{grid-column:1 / -1;grid-row:2}}
.q-card{display:grid;gap:10px}
.q-text{margin:0;font-size:19px;font-weight:700}
.q-text b{color:var(--accent)}
.q-hint{margin:0;font-size:13.5px;color:var(--muted)}
.q-fb{margin:0;font-size:15px;padding:10px 12px;border-radius:8px}
.q-fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ink)}
.q-fb.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--ink)}
.q-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-score{margin-left:auto;font-size:13px;color:var(--muted)}
.q-layers{display:flex;flex-wrap:wrap;gap:6px}
.q-layers button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.q-layers button:hover{border-color:var(--accent)}

/* ---------- transport ---------- */
.transport{padding:12px 14px;display:grid;gap:10px}
.t-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.btns{display:flex;gap:6px;align-items:center}
.btn{height:38px;min-width:38px;padding:0 10px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13.5px;transition:background-color .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.play{width:54px;height:44px;background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:12px}
.btn.play svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,var(--surface-2));border-color:var(--accent)}
.timeline{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:10px}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field input[type=range]{width:110px}
.field output{font-family:var(--font-mono);color:var(--ink);min-width:54px;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2);color:var(--ink)}

/* ---------- code panel ---------- */
.code-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 0 14px;flex-wrap:wrap}
.code-head h2,.theory h2{margin:0;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.langs button{border:0;background:none;border-radius:7px;padding:4px 12px;cursor:pointer;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.langs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.code-tools{display:flex;gap:8px;align-items:center}
.btn.small{height:30px;font-size:12.5px;padding:0 10px}
.code-sub{margin:6px 14px 0;font-size:12.5px;color:var(--muted)}
.code{position:relative;margin:8px 0 0;background:var(--code-bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);max-height:min(580px,64vh);overflow:auto;font-family:var(--font-mono);font-size:12.6px;line-height:1.62;padding:8px 0;tab-size:4}
@media (max-width:1060px){.code{max-height:520px}}
.ln{display:flex;white-space:pre;padding-right:16px;min-width:max-content;border-left:3px solid transparent;transition:background-color .18s}
.ln .no{flex:none;width:38px;text-align:right;padding-right:14px;color:var(--tok-com);user-select:none;opacity:.8}
.ln.hot{background:var(--code-hot);border-left-color:var(--code-hot-bar)}
.ln.hot .no{color:var(--ink);opacity:1;font-weight:600}
.t-kw{color:var(--tok-kw);font-weight:600}.t-fn{color:var(--tok-fn)}.t-num{color:var(--tok-num)}.t-str{color:var(--tok-str)}.t-com{color:var(--tok-com);font-style:italic}
.run{padding:10px 14px 12px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.run code{font-family:var(--font-mono);font-size:12px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;overflow-wrap:anywhere}

/* ---------- theory ---------- */
.theory{padding:14px 16px 16px;display:grid;gap:12px}
.idea,.memo{margin:0;font-size:15px;max-width:62ch}
.memo{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.memo b{color:var(--ink)}
.cx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cx div{padding:8px 10px;display:grid;gap:0;border-right:1px solid var(--line);min-width:0}
.cx div:last-child{border-right:0}
.cx .k{font-size:11px;color:var(--muted)}
.cx .v{font-family:var(--font-mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
@media (max-width:460px){.cx{grid-template-columns:repeat(2,minmax(0,1fr))}.cx div:nth-child(2){border-right:0}.cx div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Network Models Lab · 3D</span>
      <h1>OSI 與 TCP/IP <b>3D</b> 實驗室</h1>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="選擇模式"></nav>
  </header>

  <main class="grid">
    <section class="col" aria-label="動畫區">
      <div class="stage" id="stage">
        <div class="hud hud-tl"><div class="chip hud-title"><span class="zh" id="hudZh">兩種模型對照</span><span class="en" id="hudEn">OSI 7 layers vs TCP/IP</span></div></div>
        <div class="hud hud-tr" id="hudStats"></div>
        <div class="hud hud-bl">
          <div class="chip seg" role="group" aria-label="視角">
            <button type="button" data-view="front" aria-pressed="false">正面</button>
            <button type="button" data-view="angle" aria-pressed="true">斜視</button>
            <button type="button" data-view="top" aria-pressed="false">俯視</button>
          </div>
          <div class="chip seg"><button type="button" id="spinBtn" aria-pressed="false">自動旋轉</button></div>
        </div>
        <div class="hud hud-br" id="tcpToggle">
          <div class="chip seg" role="group" aria-label="TCP/IP 分層方式">
            <button type="button" data-tcp="4" aria-pressed="true">TCP/IP 4 層</button>
            <button type="button" data-tcp="5" aria-pressed="false">5 層（教科書）</button>
          </div>
        </div>
        <div class="tip" id="tip" hidden></div>
      </div>

      <!-- 對照模式 -->
      <div class="panel mpanel" id="pCompare">
        <div class="detail" id="detail"></div>
        <div class="tblwrap"><table class="cmp" id="cmpTable"></table></div>
      </div>

      <!-- 封裝模式 -->
      <div class="panel mpanel" id="pEncap" hidden>
        <div class="narr-row"><span class="narr-step" id="stepLbl">步驟 0 / 0</span><span class="narr-text" id="narr" aria-live="polite"></span></div>
        <div class="anat" id="anat" aria-label="封包內容"></div>
      </div>
      <div class="panel transport" id="pTransport" hidden>
        <div class="t-row">
          <div class="btns">
            <button class="btn" type="button" id="bFirst" aria-label="回到開頭" title="回到開頭"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
            <button class="btn" type="button" id="bPrev" aria-label="上一步" title="上一步 (←)"><svg viewBox="0 0 24 24"><path d="M15.5 5v14L5 12z"/><path d="M17 5h2v14h-2z"/></svg></button>
            <button class="btn play" type="button" id="bPlay" aria-label="播放" title="播放／暫停 (空白鍵)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15L19.5 12z"/></svg></button>
            <button class="btn" type="button" id="bNext" aria-label="下一步" title="下一步 (→)"><svg viewBox="0 0 24 24"><path d="M8.5 5v14L19 12z"/><path d="M5 5h2v14H5z"/></svg></button>
            <button class="btn" type="button" id="bLast" aria-label="跳到結果" title="跳到結果"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
          </div>
          <div class="timeline"><input type="range" id="timeline" min="0" max="0" value="0" aria-label="時間軸"></div>
          <div class="field"><label for="speed">速度</label><input type="range" id="speed" min="1" max="7" value="3"><output id="speedOut" for="speed">0.5 步/秒</output></div>
          <button class="btn" type="button" id="soundBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM18.5 6a8.5 8.5 0 0 1 0 12l-1.2-1.2a6.8 6.8 0 0 0 0-9.6z"/></svg><span>音效</span></button>
        </div>
        <p class="hint">右邊的程式碼會跟著亮起正在處理的那一層。快捷鍵：<kbd>空白</kbd> 播放、<kbd>←</kbd><kbd>→</kbd> 單步。</p>
      </div>

      <!-- 練習模式 -->
      <div class="panel mpanel" id="pQuiz" hidden>
        <div class="q-card">
          <p class="q-text" id="qText"></p>

  if (st.mode === 'encap') return null;

function beep(freq, type = 'triangle', len = 0.14, vol = 0.09){
  if (!st.sound || !actx) return;
  const now = performance.now(); if (now - lastBeep < 26) return; lastBeep = now;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + len + 0.02);
}

const THEORY = {
  compare:{
    idea:'兩個模型都把網路通訊拆成好幾層，每一層只管自己的事，只和正上方、正下方的層打交道。OSI 七層是 ISO 訂的參考模型，分得細，適合拿來分類與找問題；TCP/IP 是網際網路實際使用的協定組，把 OSI 的第 5～7 層併成應用層、第 1～2 層併成網路存取層。點任一層看細節。',
    memo:'<b>口訣（由上往下）：應、表、會、傳、網、資、實。</b>英文記法 All People Seem To Need Data Processing。考試常見陷阱：交換器在第 2 層、路由器在第 3 層、集線器在第 1 層；TCP/IP 的「網際網路層」對應 OSI 的「網路層」。',
    cx:[['OSI 層數', '7'], ['TCP/IP 層數', '4（教科書常用 5）'], ['OSI 提出', 'ISO，1984 年'], ['TCP/IP 起源', 'ARPANET，1983 年全面採用']]

  encap:{

    memo:'<b>PDU 口訣：資料 → 區段 → 封包 → 訊框 → 位元。</b>MAC 位址每經過一台路由器就換一次，IP 位址從頭到尾不變；路由器會把 TTL 減 1，所以 IP 檢查碼要重算。',
    cx:[['資料', `${N} B`], ['區段', `${N + 20} B`], ['封包', `${N + 40} B`], ['訊框', `${N + 54} B`]]

    cx:[['題庫', `${BANK.length} 題`], ['OSI 題', '點左塔'], ['TCP/IP 題', '點右塔'], ['答對後', '自動換題']]

  const btn = e.currentTarget, text = CODE[st.lang].text;
  const ok = () => { btn.textContent = '已複製'; setTimeout(() => btn.textContent = '複製', 1400); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(el.code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '已選取，按 Ctrl+C'; setTimeout(() => btn.textContent = '複製', 2200); };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (_) { fallback(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.closest && t.closest('input,textarea,select')) return;
  const inTabs = t.closest && t.closest('[role=tablist]');
  if (st.mode === 'encap'){
    if (e.key === ' ' && !(t.closest && t.closest('button'))){ e.preventDefault(); ensureAudio(); toggle(); }
    else if (e.key === 'ArrowRight' && !inTabs){ e.preventDefault(); pause(); go(st.idx + 1, true); }
    else if (e.key === 'ArrowLeft' && !inTabs){ e.preventDefault(); pause(); go(st.idx - 1, true); }
  } else if (st.mode === 'compare' && !inTabs && (e.key === 'ArrowUp' || e.key === 'ArrowDown')){
    e.preventDefault(); selectLayer(Math.max(1, Math.min(7, st.sel + (e.key === 'ArrowUp' ? 1 : -1))));
  }
});

/* =====================================================================
   9. 封包的移動路徑與主迴圈
   ===================================================================== */
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const PK = { path:null, t:1, dur:.6, applied:null, transit:false };
function pktPos(f){ return new THREE.Vector3(DEV[f.dev].x, ey(f.L), E.pz); }
function setPacketTarget(prev, f){
  if (!gl) return;
  const p1 = pktPos(f), p0 = pkt.position.clone();
  if (prev && prev.dev !== f.dev && Math.abs(st.idx - st.frames.indexOf(prev)) === 1){
    const a = new THREE.Vector3(p0.x, 0.28, E.pz), b = new THREE.Vector3(p1.x, 0.28, E.pz);
    PK.path = [p0, a, b, p1];
  } else PK.path = [p0, p1];
  PK.t = 0; PK.dur = (st.playing ? Math.min(1.4, 1.1 / SPS[st.speed - 1]) : 0.8) * (PK.path.length > 2 ? 1.6 : 1);
  PK.pending = f.parts;
  if (PK.path.length === 2) PK.applied = f.parts;
}
function pathAt(path, t){
  const n = path.length - 1, seg = Math.min(n - 1, Math.floor(t * n)), u = t * n - seg;
  return { p:path[seg].clone().lerp(path[seg + 1], u), seg, n };
}
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (st.playing && st.mode === 'encap'){
    st.acc += dt * SPS[st.speed - 1];
    if (st.acc >= 1 && st.idx < st.frames.length - 1){ st.acc = 0; go(st.idx + 1, true); }
    if (st.idx >= st.frames.length - 1) pause();
  }
  if (uiDirty){ uiDirty = false; if (st.mode === 'encap') renderEncapUI(); }
  if (gl) render3D(now, dt);
  requestAnimationFrame(loop);
}
function render3D(now, dt){
  const k = 1 - Math.exp(-dt * 10);
  if (st.mode !== 'encap'){
    const hov = st.hover, sel = st.mode === 'compare' ? st.sel : null;
    const selG = sel ? groupOf(sel) : null, hovG = hov ? (hov.osi ? groupOf(hov.osi) : tcpList()[hov.tcp]) : null;
    const fl = flash && now - flash.t < 2600 ? flash : null;
    osiSlabs.forEach(o => {
      let t = 0;
      if (sel === o.L) t = 1; else if (selG && o.L >= selG.lo && o.L <= selG.hi) t = .45;
      if (hov && (hov.osi === o.L || (hovG && !hov.osi && o.L >= hovG.lo && o.L <= hovG.hi))) t = Math.max(t, .7);
      if (fl && fl.osi === o.L) t = .6 + .4 * Math.abs(Math.sin(now * 0.008));
      o.hl += (t - o.hl) * k;
      let x = CMP.x0; if (o.shake > 0){ x += Math.sin(now * 0.06) * 0.15 * o.shake; o.shake = Math.max(0, o.shake - dt * 2.2); }
      o.mesh.position.x = x + o.hl * 0.25; o.lab.position.x = o.mesh.position.x;
      o.mesh.position.z = o.hl * 0.35; o.lab.position.z = CMP.d / 2 + 0.012 + o.hl * 0.35;
      o.mesh.material.emissive.copy(fl && fl.osi === o.L ? (fl.ok ? COL.ok : COL.cmp) : COL['l' + o.L]).multiplyScalar(0.35 * o.hl);
    });
    tcpSlabs.forEach(o => {
      let t = 0;
      if (selG === o.g) t = 1;
      if (hovG === o.g) t = Math.max(t, .7);
      if (fl && fl.tcp === o.gi) t = .6 + .4 * Math.abs(Math.sin(now * 0.008));
      o.hl += (t - o.hl) * k;
      let x = CMP.x1; if (o.shake > 0){ x += Math.sin(now * 0.06) * 0.15 * o.shake; o.shake = Math.max(0, o.shake - dt * 2.2); }
      o.mesh.position.x = x - o.hl * 0.25; o.lab.position.x = o.mesh.position.x;
      o.mesh.position.z = o.hl * 0.35; o.lab.position.z = CMP.d / 2 + 0.012 + o.hl * 0.35;
      o.mesh.material.emissive.copy(fl && fl.tcp === o.gi ? (fl.ok ? COL.ok : COL.cmp) : new THREE.Color(o.g.col)).multiplyScalar(0.35 * o.hl);
    });
    bands.forEach(b => {
      const g = tcpList()[b.gi], t = (selG === g || hovG === g || (fl && fl.tcp === b.gi)) ? 1 : 0;
      b.hl += (t - b.hl) * k; b.mesh.material.opacity = 0.12 + 0.32 * b.hl;
    });
  } else {
    const f = st.frames[st.idx];
    devSlabs.forEach(s => {
      const t = s.di === f.dev && s.L === f.L ? 1 : 0;
      s.hl += (t - s.hl) * k;
      s.mesh.material.emissive.copy(COL['l' + s.L]).multiplyScalar(0.55 * s.hl);
      s.mesh.material.opacity = 0.55 + 0.45 * Math.max(s.hl, s.di === f.dev ? 0.6 : 0);
    });
    if (PK.t < 1){
      PK.t = Math.min(1, PK.t + dt / PK.dur);
      const e = ease(PK.t), r = pathAt(PK.path, e);
      pkt.position.copy(r.p);
      PK.transit = r.n > 1 && r.seg === 1;
      if (r.n > 1 && r.seg >= r.n - 1) PK.applied = PK.pending;
    } else { PK.transit = false; PK.applied = PK.pending || PK.applied; }
    const applied = PK.applied || f.parts;
    const atL1 = f.L === 1 && PK.t >= 1;
    const shrink = PK.transit ? 0.05 : atL1 ? 0.55 : 1;
    let total = 0;
    PARTS.forEach(p => { const o = parts[p.k]; o.s += ((applied[p.k] ? 1 : 0) - o.s) * k; total += p.w * o.s; });
    let x = -total / 2;
    PARTS.forEach(p => {
      const o = parts[p.k], w = p.w * o.s;
      o.mesh.visible = o.s > 0.02;
      o.mesh.scale.set(Math.max(0.001, w - 0.02), 0.36 * shrink + 0.001, 0.5 * shrink + 0.001);
      o.mesh.position.set(x + w / 2, (1 - o.s) * 0.8, 0);
      o.mesh.material.color.copy(COL['l' + p.L]);
      if (p.k === 'l2' && f.hop === 2) o.mesh.material.color.lerp(new THREE.Color(0xffffff), 0.25);
      o.lab.visible = o.s > 0.5 && shrink > 0.5;
      o.lab.position.set(x + w / 2, 0.36 + 0.06 + (p.k === 'fcs' ? 0.2 : 0), 0);
      x += w;
    });
    const showBits = PK.transit || atL1;
    bitsGroup.visible = showBits;
    if (showBits){
      bitCubes.forEach((b, i) => {
        const ph = (now * 0.0016 + i / bitCubes.length) % 1;
        if (atL1 && !PK.transit){ b.position.set(pkt.position.x - 0.9 + ph * 1.8, 0.35 + Math.sin(ph * Math.PI * 2 + i) * 0.12, E.pz + 0.35); }
        else b.position.set(pkt.position.x - i * 0.16, 0.3 + Math.sin(now * 0.01 + i) * 0.06, E.pz);
      });
    }
  }
  if (cam.fly){
    const Fl = cam.fly; Fl.t = Math.min(1, Fl.t + dt / 0.8); const e = ease(Fl.t);
    camera.position.lerpVectors(Fl.p0, Fl.p1, e); controls.target.lerpVectors(Fl.t0, Fl.t1, e);
    if (Fl.t >= 1) cam.fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

/* =====================================================================
   10. 啟動
   ===================================================================== */
initScene();
bindPointer();
if (gl){ pkt.position.copy(pktPos(st.frames[0])); PK.applied = st.frames[0].parts; }
el.speedOut.textContent = `${SPS[st.speed - 1]} 步/秒`;
renderCode();
setMode(st.mode);
resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
